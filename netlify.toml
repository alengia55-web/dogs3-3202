"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "bun run build:netlify"
  publish = "packages/web/dist"
  functions = "packages/web/netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  BUN_VERSION = "1.3.14"

[functions]
  node_bundler = "esbuild"

# Host-specific redirects must precede SPA rewrites and apply to real files too.
# Old bookmarks, including /admin, keep their paths on the new HTTPS domain.
[[redirects]]
  from = "https://shelterdogsk.netlify.app/*"
  to = "https://kinokomeiodimoumeteoron.gr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://shelterdogsk.netlify.app/*"
  to = "https://kinokomeiodimoumeteoron.gr/:splat"
  status = 301
  force = true

# Only frontend routes are rewritten. /api/* is handled directly by api.ts.
# Avoid a catch-all rewrite which could swallow API requests.
[[redirects]]
  from = "/dogs/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/adopt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/volunteer"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/donate"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"